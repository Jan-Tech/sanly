version: '3.9'

services:
  db-customs:
    image: postgres:16-alpine
    container_name: db-customs-standalone
    environment:
      POSTGRES_DB: sanly_customs
      POSTGRES_USER: customs_user
      POSTGRES_PASSWORD: customs_pass
    volumes:
      - db_customs_standalone:/var/lib/postgresql/data
    ports:
      - "5445:5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -d sanly_customs]
      interval: 10s
      timeout: 5s
      retries: 5

  sanly-customs:
    build: .
    container_name: sanly-customs-standalone
    ports:
      - "8093:8093"
    environment:
      DB_URL: jdbc:postgresql://db-customs:5432/sanly_customs
      DB_USERNAME: customs_user
      DB_PASSWORD: customs_pass
      JWT_SECRET: change-me-jwt-secret-32-chars-minimum
      ENCRYPTION_KEY: change-me-aes-256-key-32-chars!!
      ADMIN_PASSWORD: admin123
      CITIZEN_REGISTRY_URL: http://host.docker.internal:8080
      CITIZEN_REGISTRY_TOKEN: placeholder
      BRIDGE_URL: http://host.docker.internal:8081
      BRIDGE_INSTITUTION_KEY: placeholder
      SERVER_PORT: 8093
      NOTIFICATION_URL: http://host.docker.internal:8088
      NOTIFICATION_SERVICE_KEY: customs-default-key-change-me
    depends_on:
      db-customs:
        condition: service_healthy

volumes:
  db_customs_standalone:
