spring:
  application:
    name: sanly-medical

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/sanly_medical}
    username: ${DB_USERNAME:medical_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ===== Field-level Encryption (notes column) =====
encryption:
  key: ${ENCRYPTION_KEY}   # Exactly 32 chars for AES-256

# ===== Seed admin account =====
seed:
  admin:
    username: admin
    password: ${ADMIN_PASSWORD}

# ===== SANLY Platform Integration =====
sanly:
  citizen-registry:
    base-url: ${CITIZEN_REGISTRY_URL:http://localhost:8080}
    # JWT token for a ROLE_INSTITUTION account registered in citizen-registry
    institution-token: ${CITIZEN_REGISTRY_TOKEN}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  bridge:
    base-url: ${BRIDGE_URL:http://localhost:8081}
    institution-code: INST_MEDICAL
    institution-key: ${BRIDGE_INSTITUTION_KEY}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

# ===== Rate Limiting =====
rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration-minutes: 1

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

notification:
  base-url: ${NOTIFICATION_URL:http://localhost:8088}
  service-key: ${NOTIFICATION_SERVICE_KEY:medical-default-key-change-me}

life-event:
  service-key: ${LIFE_EVENT_SERVICE_KEY:change-me-life-event-key}

# ===== Logging =====
logging:
  level:
    com.sanly.medical: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
