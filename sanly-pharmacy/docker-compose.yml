version: '3.9'

# Standalone compose for sanly-pharmacy only.
# For full-platform startup use the root docker-compose.yml.

services:
  db-pharmacy:
    image: postgres:16-alpine
    container_name: db-pharmacy
    environment:
      POSTGRES_DB: sanly_pharmacy
      POSTGRES_USER: pharmacy_user
      POSTGRES_PASSWORD: pharmacy_pass
    volumes:
      - db_pharmacy_data:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sanly_pharmacy"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanly-pharmacy:
    build: .
    container_name: sanly-pharmacy
    ports:
      - "8089:8089"
    environment:
      DB_URL: jdbc:postgresql://db-pharmacy:5432/sanly_pharmacy
      DB_USERNAME: pharmacy_user
      DB_PASSWORD: pharmacy_pass
      JWT_SECRET: change-me-32-chars-minimum-secret
      ADMIN_PASSWORD: admin123
      PHARMACY_CODE: TM-PHR-0001
      PHARMACY_API_KEY: ""
      CITIZEN_REGISTRY_URL: http://localhost:8080
      CITIZEN_REGISTRY_TOKEN: ""
      BRIDGE_URL: http://localhost:8081
      BRIDGE_INSTITUTION_KEY: ""
      MEDICAL_URL: http://localhost:8082
      NOTIFICATION_URL: http://localhost:8088
      NOTIFICATION_SERVICE_KEY: pharmacy-default-key-change-me
    depends_on:
      db-pharmacy:
        condition: service_healthy

volumes:
  db_pharmacy_data:
