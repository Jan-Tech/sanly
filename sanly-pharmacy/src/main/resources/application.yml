server:
  port: 8089

spring:
  application:
    name: sanly-pharmacy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5441/sanly_pharmacy}
    username: ${DB_USERNAME:pharmacy_user}
    password: ${DB_PASSWORD:pharmacy_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

seed:
  admin:
    password: ${ADMIN_PASSWORD}

sanly:
  citizen-registry:
    base-url: ${CITIZEN_REGISTRY_URL:http://localhost:8080}
    institution-token: ${CITIZEN_REGISTRY_TOKEN}
  bridge:
    base-url: ${BRIDGE_URL:http://localhost:8081}
    institution-code: INST_PHARMACY
    institution-key: ${BRIDGE_INSTITUTION_KEY}
  medical:
    base-url: ${MEDICAL_URL:http://localhost:8082}
    # The raw pharmacy API key registered in sanly-medical
    pharmacy-code: ${PHARMACY_CODE:TM-PHR-0001}
    pharmacy-key: ${PHARMACY_API_KEY}

notification:
  base-url: ${NOTIFICATION_URL:http://localhost:8088}
  service-key: ${NOTIFICATION_SERVICE_KEY:pharmacy-default-key-change-me}

rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration-minutes: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sanly.pharmacy: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
