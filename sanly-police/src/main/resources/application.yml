spring:
  application:
    name: sanly-police
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/sanly_police}
    username: ${DB_USERNAME:police_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
    properties.hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    serialization.write-dates-as-timestamps: false
    deserialization.fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

encryption:
  key: ${ENCRYPTION_KEY}

seed:
  admin:
    username: admin
    password: ${ADMIN_PASSWORD}

sanly:
  citizen-registry:
    base-url: ${CITIZEN_REGISTRY_URL:http://localhost:8080}
    institution-token: ${CITIZEN_REGISTRY_TOKEN}
  bridge:
    base-url: ${BRIDGE_URL:http://localhost:8081}
    institution-code: INST_POLICE
    institution-key: ${BRIDGE_INSTITUTION_KEY}

rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration-minutes: 1

management.endpoints.web.exposure.include: health,info,metrics

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

notification:
  base-url: ${NOTIFICATION_URL:http://localhost:8088}
  service-key: ${NOTIFICATION_SERVICE_KEY:police-default-key-change-me}

logging.level:
  com.sanly.police: INFO
  org.springframework.security: WARN
