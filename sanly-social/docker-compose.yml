version: '3.9'

services:
  db-social:
    image: postgres:16-alpine
    container_name: db-social-standalone
    environment:
      POSTGRES_DB: sanly_social
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_pass
    volumes:
      - db_social_standalone:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -d sanly_social]
      interval: 10s
      timeout: 5s
      retries: 5

  sanly-social:
    build: .
    container_name: sanly-social-standalone
    ports:
      - "8092:8092"
    environment:
      DB_URL: jdbc:postgresql://db-social:5432/sanly_social
      DB_USERNAME: social_user
      DB_PASSWORD: social_pass
      JWT_SECRET: change-me-jwt-secret-32-chars-minimum
      ENCRYPTION_KEY: change-me-aes-256-key-32-chars!!
      ADMIN_PASSWORD: admin123
      CITIZEN_REGISTRY_URL: http://host.docker.internal:8080
      CITIZEN_REGISTRY_TOKEN: placeholder
      BRIDGE_URL: http://host.docker.internal:8081
      BRIDGE_INSTITUTION_KEY: placeholder
      SERVER_PORT: 8092
      NOTIFICATION_URL: http://host.docker.internal:8088
      NOTIFICATION_SERVICE_KEY: social-default-key-change-me
      LIFE_EVENT_SERVICE_KEY: change-me-life-event-key
    depends_on:
      db-social:
        condition: service_healthy

volumes:
  db_social_standalone:
