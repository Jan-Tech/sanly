server:
  port: 8100
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: sanly-signature
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5449/sanly_signature}
    username: ${DB_USERNAME:signature_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

encryption:
  key: ${ENCRYPTION_KEY}   # exactly 32 chars for AES-256

signing:
  secret: ${SERVER_SIGNING_SECRET}   # min 32 chars for HMAC-SHA256

registry:
  base-url: ${REGISTRY_URL:http://localhost:8080}
  service-name: ${SERVICE_NAME:SANLY_SIGNATURE}
  service-key: ${SERVICE_KEY}

notification:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
  service-key: ${NOTIFICATIONS_KEY_SIGNATURE:signature-default-key-change-me}

tracking:
  base-url: ${DOCUMENTS_URL:http://localhost:8102}
  service-key: ${TRACKING_SERVICE_KEY:tracking-service-key-change-me}

bridge:
  base-url: ${BRIDGE_URL:http://localhost:8081}
  institution-key: ${BRIDGE_INSTITUTION_KEY_SIGNATURE}

rate-limit:
  sign-per-hour: 10

qr:
  verify-base-url: ${QR_VERIFY_BASE_URL:https://sanly.tm/verify}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

seed:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
