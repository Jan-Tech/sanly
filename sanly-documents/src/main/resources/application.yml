server:
  port: 8102
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: sanly-documents
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5451/sanly_documents}
    username: ${DB_USERNAME:documents_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
signing:
  cert-secret: ${SERVER_CERT_SECRET}
registry:
  base-url: ${REGISTRY_URL:http://localhost:8080}
  institution-token: ${REGISTRY_INSTITUTION_TOKEN}
services:
  civil-url: ${CIVIL_URL:http://localhost:8087}
  civil-token: ${CIVIL_SERVICE_TOKEN}
  dmv-url: ${DMV_URL:http://localhost:8083}
  dmv-token: ${DMV_SERVICE_TOKEN}
  education-url: ${EDUCATION_URL:http://localhost:8090}
  education-token: ${EDUCATION_SERVICE_TOKEN}
  land-url: ${LAND_URL:http://localhost:8091}
  land-token: ${LAND_SERVICE_TOKEN}
  business-url: ${BUSINESS_URL:http://localhost:8086}
  business-token: ${BUSINESS_SERVICE_TOKEN}
  tax-url: ${TAX_URL:http://localhost:8085}
  tax-token: ${TAX_SERVICE_TOKEN}
  police-url: ${POLICE_URL:http://localhost:8084}
  police-token: ${POLICE_SERVICE_TOKEN}
  medical-url: ${MEDICAL_URL:http://localhost:8082}
  medical-token: ${MEDICAL_SERVICE_TOKEN}
  court-url: ${COURT_URL:http://localhost:8094}
  court-token: ${COURT_SERVICE_TOKEN}
  pension-url: ${PENSION_URL:http://localhost:8099}
  pension-token: ${PENSION_SERVICE_TOKEN}
  vehicle-url: ${VEHICLE_URL:http://localhost:8096}
  vehicle-token: ${VEHICLE_SERVICE_TOKEN}
notification:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
  service-key: ${NOTIFICATIONS_KEY_DOCUMENTS:documents-default-key-change-me}
tracking:
  service-key: ${TRACKING_SERVICE_KEY:tracking-internal-key-change-me}
rate-limit:
  capacity: 100
  refill-minutes: 1
  cert-capacity: 20
  cert-refill-hours: 1
seed:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
qr:
  verify-base-url: ${QR_BASE_URL:https://sanly.tm/verify-cert}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
