spring:
  application:
    name: sanly-bridge

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sanly_bridge}
    username: ${DB_USERNAME:bridge_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ===== JWT (admin endpoints) =====
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ===== Seed Admin User =====
seed:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

# ===== Rate Limiting =====
rate-limit:
  admin:
    capacity: 100
    refill-tokens: 100
    refill-duration-minutes: 1
  institution:
    capacity: 50
    refill-tokens: 50
    refill-duration-minutes: 1

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ===== Notification Service =====
notification:
  base-url: ${NOTIFICATION_URL:http://localhost:8088}
  service-key: ${NOTIFICATION_SERVICE_KEY:bridge-default-key-change-me}

# ===== Logging =====
logging:
  level:
    com.sanly.bridge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
