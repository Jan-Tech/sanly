spring:
  application:
    name: sanly-dmv

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/sanly_dmv}
    username: ${DB_USERNAME:dmv_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ===== Admin seed =====
seed:
  admin:
    username: admin
    password: ${ADMIN_PASSWORD}

# ===== SANLY Platform Integration =====
sanly:
  citizen-registry:
    base-url: ${CITIZEN_REGISTRY_URL:http://localhost:8080}
    institution-token: ${CITIZEN_REGISTRY_TOKEN}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  bridge:
    base-url: ${BRIDGE_URL:http://localhost:8081}
    institution-code: INST_DMV
    institution-key: ${BRIDGE_INSTITUTION_KEY}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

# ===== Rate Limiting =====
rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration-minutes: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sanly.dmv: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

notification:
  base-url: ${NOTIFICATION_URL:http://localhost:8088}
  service-key: ${NOTIFICATION_SERVICE_KEY:dmv-default-key-change-me}

tracking:
  base-url: ${DOCUMENTS_URL:http://localhost:8102}
  service-key: ${TRACKING_SERVICE_KEY:tracking-service-key-change-me}

life-event:
  service-key: ${LIFE_EVENT_SERVICE_KEY:change-me-life-event-key}
