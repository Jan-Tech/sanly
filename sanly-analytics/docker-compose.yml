version: '3.9'

services:
  db-analytics:
    image: postgres:16-alpine
    container_name: db-analytics-standalone
    environment:
      POSTGRES_DB: sanly_analytics
      POSTGRES_USER: ${DB_USERNAME:-analytics_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_analytics_data:/var/lib/postgresql/data
    ports:
      - "5452:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sanly_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanly-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanly-analytics-standalone
    ports:
      - "8103:8103"
    environment:
      DB_URL: jdbc:postgresql://db-analytics:5432/sanly_analytics
      DB_USERNAME: ${DB_USERNAME:-analytics_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://localhost:8088}
      NOTIFICATIONS_KEY_ANALYTICS: ${NOTIFICATIONS_KEY_ANALYTICS:-analytics-default-key-change-me}
      ANALYTICS_SERVICE_KEY: ${ANALYTICS_SERVICE_KEY:-analytics-ingest-key-change-me}
      SERVER_PORT: 8103
    depends_on:
      db-analytics:
        condition: service_healthy

volumes:
  db_analytics_data:
