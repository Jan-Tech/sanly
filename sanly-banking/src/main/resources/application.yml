server:
  port: 8104
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: sanly-banking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5453/sanly_banking}
    username: ${DB_USERNAME:banking_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

encryption:
  key: ${ENCRYPTION_KEY}

registry:
  base-url: ${REGISTRY_URL:http://localhost:8080}
  institution-token: ${REGISTRY_INSTITUTION_TOKEN}
  service-key: ${REGISTRY_SERVICE_KEY:registry-banking-key}

services:
  tax-url: ${TAX_URL:http://localhost:8085}
  tax-token: ${TAX_SERVICE_TOKEN}
  police-url: ${POLICE_URL:http://localhost:8084}
  police-token: ${POLICE_SERVICE_TOKEN}
  business-url: ${BUSINESS_URL:http://localhost:8086}
  business-token: ${BUSINESS_SERVICE_TOKEN}
  land-url: ${LAND_URL:http://localhost:8091}
  land-token: ${LAND_SERVICE_TOKEN}
  pension-url: ${PENSION_URL:http://localhost:8099}
  pension-token: ${PENSION_SERVICE_TOKEN}
  dmv-url: ${DMV_URL:http://localhost:8083}
  dmv-token: ${DMV_SERVICE_TOKEN}

notification:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
  service-key: ${NOTIFICATIONS_KEY_BANKING:banking-default-key-change-me}

seed:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
